[package]
name = "crypto-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Explicit browser transport for CriptoLab's educational core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crypto-core = { path = "../crypto-core" }
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
serde = { version = "=1.0.228", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
